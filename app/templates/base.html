{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Patriventaire{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="{% static 'styles.css' %}" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <nav class="container navbar navbar-expand-sm py-3" aria-label="Navigation principale">
            <a class="site-brand me-4" href="{% url 'element:index' %}">Patriventaire</a>
            <div class="navbar-nav">
                <a class="site-nav-link nav-link px-0" href="{% url 'element:ajouter' %}">Ajouter un élément</a>
            </div>
        </nav>
    </header>

    <main class="container py-4 py-md-5">
        <section class="page-card p-4 p-md-5">
            {% block content %}{% endblock %}
        </section>
    </main>

    <footer class="site-footer container pb-4">
        <p class="mb-0">Patriventaire</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
