services:
  patriventaire:
    build: .
    image: patriventaire
    command: ["python", "manage.py", "runserver", "0.0.0.0:80"]
    container_name: patriventaire
    env_file:
      - .env
    volumes:
      - ./medias:/usr/src/app/medias
    depends_on:
      - patriventaire-database
    ports:
      - "8000:80"
    restart: unless-stopped
  patriventaire-database:
    image: postgres:18-alpine
    container_name: patriventaire-database
    env_file:
      - .env
    volumes:
      - postgres-18:/var/lib/postgresql
    restart: unless-stopped
volumes:
  postgres-18: {}